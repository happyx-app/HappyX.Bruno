info:
  name: My «Who's who?» scores
  type: http
  seq: 12
http:
  method: GET
  url: '{{webApiUrl}}/web/demo/{{demoLang}}/me/games?from={{from}}&to={{to}}'
  params:
  - name: from
    value: '{{from}}'
    type: query
  - name: to
    value: '{{to}}'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'The demo admin''s own «Who''s who?» score per finished round. Default: last 30 days.'
