info:
  name: My moods (evolution)
  type: http
  seq: 2
http:
  method: GET
  url: '{{webApiUrl}}/web/demo/{{demoLang}}/me/moods?from={{from}}&to={{to}}'
  params:
  - name: from
    value: '{{from}}'
    type: query
  - name: to
    value: '{{to}}'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'The demo admin''s own answers. Default: last 30 days.'
