request:
  auth:
    type: none
docs: |-
  The made-up server the web shows at `/demo`, «Demo Team» (`en`) or «Equipo Demo» (`es`). No login and no secrets: anyone can call these. Same responses as the Web dashboard routes, always seen as the demo's main admin, and only ever about the demo server (`100000000000000001`; any other ID is 404). There are no write routes.

  `demoLang` picks the language (`en` or `es`). Off when the API has `DEMO_ENABLED=false`.
