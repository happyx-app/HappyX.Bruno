info:
  name: Join or update member
  type: http
  seq: 3
http:
  method: PUT
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/members/{{userId}}'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "username": "someone",
        "active": true,
        "role_ids": []
      }
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: '`active` and `role_ids` are optional: omitted keeps the stored value.'
