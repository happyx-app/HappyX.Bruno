info:
  name: List members
  type: http
  seq: 1
http:
  method: GET
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/members?with=streak'
  params:
  - name: with
    value: streak
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: '`?with=streak` adds each member''s answering streak.'
