info:
  name: List survey recipients
  type: http
  seq: 7
http:
  method: GET
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/members?for=survey&with=streak'
  params:
  - name: for
    value: survey
    type: query
  - name: with
    value: streak
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: "Members the daily survey goes to, after the server's `survey_roles`, without those on vacation today. `?with=streak` is optional. `?day=YYYY-MM-DD` leaves out who was on vacation that day instead: who got that day's survey, for «Answer today» before today's goes out. `policy_pending: true` marks members who haven't answered in the server since the privacy policy's date; their survey links the policy."
