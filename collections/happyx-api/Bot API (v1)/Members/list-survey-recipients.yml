info:
  name: List survey recipients
  type: http
  seq: 7
http:
  method: GET
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/members?for=survey&with=streak'
  params:
  - name: for
    value: survey
    type: query
  - name: with
    value: streak
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: Members the daily survey goes to, after the server's `survey_roles`. `?with=streak` is optional.
