info:
  name: Sync members (bulk)
  type: http
  seq: 2
http:
  method: PUT
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/members'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "members": [
          {
            "discord_user_id": "{{userId}}",
            "username": "someone",
            "display_name": "Someone",
            "role_ids": []
          }
        ]
      }
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Registers up to 1000 members or refreshes their names and roles, keeping opt-in state. `display_name` is the name the server shows (server nickname, else Discord display name, else username); empty keeps the stored one. 204.'
