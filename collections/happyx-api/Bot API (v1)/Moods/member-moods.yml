docs: 'The member''s own answers in this server from `from` to `to` (YYYY-MM-DD, at most 31 days), oldest first: `[{discord_user_id, day, mood, message}]`. The bot shows them only to that member: «Your week» on the thanks card of the week''s last working day, or today''s answer when they answer from the team channel. 400 for a bad range; 404 when they aren''t a member.'
