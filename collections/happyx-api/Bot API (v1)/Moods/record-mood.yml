info:
  name: Record mood
  type: http
  seq: 1
http:
  method: PUT
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/members/{{userId}}/mood'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "mood": 4,
        "message": "Good day",
        "day": ""
      }
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: '`mood` 1–5. `day` is optional (YYYY-MM-DD); empty means today in the guild''s timezone.'
