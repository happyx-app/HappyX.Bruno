info:
  name: Publish team note
  type: http
  seq: 1
http:
  method: POST
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/team-notes'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "author_discord_user_id": "{{userId}}",
        "from": "2026-11-09",
        "to": "2026-11-15",
        "body": "Muchas reuniones seguidas: lo hemos visto. Desde el lunes, martes por la tarde sin reuniones.",
        "channel_id": "{{channelId}}",
        "message_id": "1300000000000000001"
      }
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: '«Tell the team» from the report: records a note the bot has just posted in the team channel, so it can be edited or deleted later and the next survey day''s thanks card can link it. `from`/`to` are the report''s period (YYYY-MM-DD); `body` 1-1000 characters; `posted_on` is today in the server''s timezone. 404 when the author isn''t a member. The bot checks the author can manage the server before posting.'
