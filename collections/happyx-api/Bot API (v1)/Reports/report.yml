info:
  name: Report
  type: http
  seq: 1
http:
  method: GET
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/report?from={{from}}&to={{to}}'
  params:
  - name: from
    value: '{{from}}'
    type: query
  - name: to
    value: '{{to}}'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: "Without `from`/`to` it returns the last complete period (week or month) of the guild. Both must be YYYY-MM-DD if given. Days with a known number of survey `recipients` carry it, and then the report has `participation` (`recipients`, `answered`); `kudos.top_receivers` lists the top three. `audience` is how many people get the survey now (left out when unknown), for «9 of 12 answered».\n\nAnonymity: a day whose anonymous answers come from fewer people than its `anonymity_threshold` (the highest of the guild's current one and the ones its answers were given under, so lowering it never shows a day that already has answers) has `withheld: true` and keeps only its `responses`; its answers and comments are left out of `average`, `distribution` and `messages` too, so `distribution` may add up to fewer than `responses`. When every answer falls on withheld days, the report has `withheld: true` and only `responses`, `respondents` and each day's `responses` are given. Anonymous messages have `message`, `day` and `mood` but no author, in the order they were written, like named ones."
