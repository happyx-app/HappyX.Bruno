info:
  name: Report
  type: http
  seq: 1
http:
  method: GET
  url: '{{apiUrl}}/v1/guilds/{{guildId}}/report?from={{from}}&to={{to}}'
  params:
  - name: from
    value: '{{from}}'
    type: query
  - name: to
    value: '{{to}}'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: "Without `from`/`to` it returns the last complete period (week or month) of the guild. Both must be YYYY-MM-DD if given. Days with a known number of survey `recipients` carry it, and then the report has `participation` (`recipients`, `answered`); `kudos.top_receivers` lists the top three.\n\nAnonymity: `withheld: true` when the period's anonymous answers come from fewer people than `anonymity_threshold`; then only `responses`, `respondents` and each day's `responses` are given (average, distribution, day averages and messages are empty). A day with `withheld: true` has no average. Anonymous messages have only `message`: no `day`, `mood` or author, in a stable order unrelated to when they were written."
