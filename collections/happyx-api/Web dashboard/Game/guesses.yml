info:
  name: Guesses
  type: http
  seq: 3
http:
  method: PUT
  url: '{{webApiUrl}}/web/guilds/{{guildId}}/game/guesses'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "guesses": {
          "<answer id>": "<discord user id>"
        }
      }
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: Map of answer → guessed member, with the IDs from Game board. 204.
