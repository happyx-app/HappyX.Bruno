info:
  name: Add member vacation
  type: http
  seq: 12
http:
  method: POST
  url: '{{webApiUrl}}/web/guilds/{{guildId}}/vacations'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "discord_user_id": "{{otherUserId}}",
        "from": "2026-12-22",
        "to": "2027-01-06"
      }
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Adds a vacation for the member in this server only; the bot tells them by DM. Up to 10 set for them here; 409 with `overlaps` if it shares a day with another set for them here. 201. Needs manage and `Content-Type: application/json`.'
