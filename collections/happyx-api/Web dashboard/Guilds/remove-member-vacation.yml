info:
  name: Remove member vacation
  type: http
  seq: 14
http:
  method: DELETE
  url: '{{webApiUrl}}/web/guilds/{{guildId}}/vacations/{{vacationId}}'
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Removes a vacation set here (not the member''s own). 204; 404 if it wasn''t set here. Needs manage and `Content-Type: application/json`.'
