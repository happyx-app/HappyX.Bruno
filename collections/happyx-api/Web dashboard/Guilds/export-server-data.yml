info:
  name: Export server data
  type: http
  seq: 5
http:
  method: GET
  url: '{{webApiUrl}}/web/guilds/{{guildId}}/export'
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Needs `owner`. Downloads `happyx-server-data` version 2: settings, members, kudos, games, canvas strokes and the survey answers with the dashboard''s anonymity. `moods` are only the answers that name their author. Anonymous answers come summed up by day in `anonymous_days` (`day`, `answers`, `withheld`, and `average` unless withheld: fewer people than `anonymity_threshold`), and their comments in `anonymous_comments`, sorted by content, without day or mood and without those of withheld days. `team_notes` are what admins told the team after a report, with their author.'
