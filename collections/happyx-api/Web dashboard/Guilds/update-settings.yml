info:
  name: Update settings
  type: http
  seq: 2
http:
  method: PATCH
  url: '{{webApiUrl}}/web/guilds/{{guildId}}/settings'
  headers:
  - name: Content-Type
    value: application/json
  body:
    type: json
    data: |-
      {
        "anonymous": true,
        "timezone": "Europe/Madrid",
        "language": "es",
        "survey_hour": 10,
        "report_frequency": "weekly",
        "report_dm": true,
        "games_enabled": true,
        "kudos_channel_id": "{{channelId}}",
        "working_days": [
          1,
          2,
          3,
          4,
          5
        ],
        "survey_message": "",
        "survey_roles": {
          "mode": "except",
          "role_ids": [
            "{{roleId}}"
          ]
        },
        "game_roles": {
          "mode": "all",
          "role_ids": []
        }
      }
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: |-
  Needs `manage`. Every field optional. `survey_message: ""` goes back to the default text. `kudos_channel_id` is one of Get channels, or `""` to post where `/happyx kudos` is used.

  `survey_roles.mode` and `game_roles.mode`: `all` (everyone, `role_ids` empty), `except` (everyone but those roles) or `only` (just those roles). Pick the roles from Get roles.
