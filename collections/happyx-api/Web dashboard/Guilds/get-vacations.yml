info:
  name: Get vacations
  type: http
  seq: 11
http:
  method: GET
  url: '{{webApiUrl}}/web/guilds/{{guildId}}/vacations'
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: '`{vacations, members}`: the vacations that apply in this server, of members still in it, that haven''t ended, by first day (`id`, `discord_user_id`, `username`, `display_name`, `from`, `to`, `note`: the member''s own note, `set_here`: set by an admin here, so admins can change it, `set_by_you`, `set_by_name`), and the members who can be given one. Other servers aren''t shown. Needs manage.'
