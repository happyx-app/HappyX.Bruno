info:
  name: Server health
  type: http
  seq: 8
http:
  method: GET
  url: '{{webApiUrl}}/web/guilds/{{guildId}}/health'
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Who the survey reaches now (`audience`: opted in, in the server, allowed by the survey roles, not on vacation today), `opted_out`, `on_vacation`, and `last_survey` (`day`, `recipients`, `failed`, `closed_dms`: of the failed DMs, how many because the person has DMs closed; `null` if none in the last 14 days), and `team_channel`: where HappyX posts to the team, so where whoever has DMs closed can answer (the team channel, or else the kudos one; `null` with neither), as `id` and `can_post` (left out when the bot hasn''t sent that channel). Needs `view`.'
