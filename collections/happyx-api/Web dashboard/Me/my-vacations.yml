info:
  name: My vacations
  type: http
  seq: 9
http:
  method: GET
  url: '{{webApiUrl}}/web/me/vacations'
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: '`{vacations, guilds, max}`: the viewer''s vacations that haven''t ended, by first day (`id`, `from`, `to`, `everywhere`, `guilds` as `{discord_guild_id, name}`, `note`, `set_by_admin`, `set_by_name`, `created_at`), the servers they can pick and `max`, how many of their own they can have (10). Servers they left aren''t shown.'
