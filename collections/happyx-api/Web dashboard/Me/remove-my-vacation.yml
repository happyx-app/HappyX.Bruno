info:
  name: Remove my vacation
  type: http
  seq: 12
http:
  method: DELETE
  url: '{{webApiUrl}}/web/me/vacations/{{vacationId}}'
  headers:
  - name: Content-Type
    value: application/json
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Removes one of the viewer''s vacations, also one an admin set for them; its days already gone stay, for streaks and «My evolution». 204; 404 if it isn''t theirs. Requires `Content-Type: application/json`.'
