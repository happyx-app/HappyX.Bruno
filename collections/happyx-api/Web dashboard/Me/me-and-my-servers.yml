info:
  name: Me and my servers
  type: http
  seq: 1
http:
  method: GET
  url: '{{webApiUrl}}/web/me'
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'The viewer, the servers they can see (`access`: `view` | `manage` | `owner`; for `view` and `manage`, `admin_username` names the main admin when known, so the web can say whom to ask for permission), the servers whose game they can play (`games`) the servers with HappyX where they are a member without dashboard access (`member_guilds`, id and name only), and the servers where they paused the survey with «don''t ask me again» (`paused_guilds`, id and name only; resume with "Pause or resume my survey").'
