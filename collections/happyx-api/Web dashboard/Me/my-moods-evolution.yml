info:
  name: My moods (evolution)
  type: http
  seq: 2
http:
  method: GET
  url: '{{webApiUrl}}/web/me/moods?from={{from}}&to={{to}}'
  params:
  - name: from
    value: '{{from}}'
    type: query
  - name: to
    value: '{{to}}'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Own answers in every server. Default: last 30 days. Each server has `anonymous`: whether today''s answer is anonymous to the admin, and, once anonymity was turned off, `named_since`: the first day with names. `anonymity_threshold` is the fewest people whose anonymous answers a day needs before admins see more than how many answered. `survey_days` are the days the survey went out in that server since you joined it, and `vacations` your days off there that touch the period (`{from, to}`), past ones included: a survey day without an answer or a vacation is one you didn''t answer. `events` are the server''s team events that touch the period, as in «Get events».'
