info:
  name: My «Who's who?» scores
  type: http
  seq: 13
http:
  method: GET
  url: '{{webApiUrl}}/web/me/games?from={{from}}&to={{to}}'
  params:
  - name: from
    value: '{{from}}'
    type: query
  - name: to
    value: '{{to}}'
    type: query
  auth: inherit
settings:
  encodeUrl: true
  followRedirects: true
docs: 'Own «Who''s who?» score in every server where you play: one entry per finished round whose week starts in the range and where you guessed (`week`, `correct`, `guesses`). Default: last 30 days. Only you see it.'
